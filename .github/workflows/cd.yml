name: deploy
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true
      - run: vp check
      - run: vp test run
      - run: vp run validate
      - run: vp run generate
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # wrangler-action defaults to its own bundled wrangler (3.90.0),
          # which predates wrangler.jsonc support and fails with
          # "Missing entry-point". Pin to the project's wrangler version.
          wranglerVersion: '4.154.0'
          packageManager: pnpm
